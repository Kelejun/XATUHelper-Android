name: CI 编译

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 构建并发布的渠道
        type: choice
        required: true
        default: prerelease
        options:
          - prerelease
          - release
  schedule:
    - cron: "0 22 * * *" # 北京时间每天 06:00，仅更新预发布渠道

permissions:
  contents: write

# 同一时间只允许一个任务发布，避免预发布附件被交错替换。
concurrency:
  group: xatune-release-publishing
  cancel-in-progress: false

jobs:
  prerelease:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.channel == 'prerelease'))
    name: Android 预发布构建
    uses: ./.github/workflows/android-package.yml
    with:
      channel: prerelease
    secrets: inherit

  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.channel == 'release'
    name: Android 正式版构建（仅手动）
    uses: ./.github/workflows/android-package.yml
    with:
      channel: release
    secrets: inherit
