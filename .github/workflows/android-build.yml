name: CI 编译

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 构建并发布的渠道
        type: choice
        required: true
        default: prerelease
        options:
          - prerelease
          - release
  schedule:
    - cron: "0 22 * * *" # 北京时间每天 06:00，仅更新预发布渠道

permissions:
  contents: write

# 同一时间只允许一个任务发布，避免预发布附件被交错替换。
concurrency:
  group: xatune-release-publishing
  cancel-in-progress: false

jobs:
  prerelease-context:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.channel == 'prerelease'))
    name: 检查预发布提交
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.context.outputs.should_build }}
      changelog: ${{ steps.context.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 比较已发布版本并生成提交记录
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/prerelease-context.py
          --repository "$GITHUB_REPOSITORY"
          --commit "$GITHUB_SHA"
          --event "$GITHUB_EVENT_NAME"
          --github-output "$GITHUB_OUTPUT"

  prerelease:
    needs: prerelease-context
    if: needs.prerelease-context.outputs.should_build == 'true'
    name: Android 预发布构建
    uses: ./.github/workflows/android-package.yml
    with:
      channel: prerelease
      changelog: ${{ needs.prerelease-context.outputs.changelog }}
    secrets: inherit

  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.channel == 'release'
    name: Android 正式版构建（仅手动）
    uses: ./.github/workflows/android-package.yml
    with:
      channel: release
    secrets: inherit
